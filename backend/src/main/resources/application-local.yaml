spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kbase
    username: kbase_user
    password: kbase_password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
