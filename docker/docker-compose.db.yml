version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kbase-postgres
    environment:
      POSTGRES_DB: kbase
      POSTGRES_USER: kbase_user
      POSTGRES_PASSWORD: kbase_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbase_user -d kbase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
